name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            iphone = devices.find { |device| device.fetch("name", "").start_with?("iPhone") }
            abort("No available iPhone simulator") unless iphone
            puts iphone.fetch("udid")
          ')
          echo "id=${DEVICE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Build and run unit tests
        run: |
          xcodebuild \
            -project FragmentCamera.xcodeproj \
            -scheme FragmentCamera \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .deriveddata \
            CODE_SIGNING_ALLOWED=NO \
            test
